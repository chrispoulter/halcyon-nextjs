services:
    halcyon-nextjs:
        image: halcyon-nextjs:latest
        build:
            context: .
        environment:
            DATABASE_URL: postgres://postgres:password@postgres:5432/halcyon_nextjs
            EMAIL_SMTP_SERVER: mailpit
            EMAIL_SMTP_PORT: 1025
            EMAIL_NO_REPLY_ADDRESS: noreply@example.com
            SESSION_DURATION: 3600
            SESSION_SECRET: super_secret_key_that_should_be_changed
        ports:
            - 3000:3000
        depends_on:
            postgres:
                condition: service_healthy
            halcyon-nextjs-migrate:
                condition: service_completed_successfully

    halcyon-nextjs-migrate:
        image: halcyon-nextjs:latest
        build:
            context: .
        command: node migrate.js
        environment:
            DATABASE_URL: postgresql://postgres:password@postgres:5432/halcyon_nextjs
            SEED_EMAIL_ADDRESS: system.administrator@example.com
            SEED_PASSWORD: super_secret_password_that_should_be_changed
        depends_on:
            postgres:
                condition: service_healthy
        restart: no

    postgres:
        image: postgres:18.3
        user: postgres
        environment:
            POSTGRES_DB: halcyon_nextjs
            POSTGRES_PASSWORD: password
        ports:
            - 5432:5432
        volumes:
            - postgres_data:/var/lib/postgresql
        restart: always
        healthcheck:
            test: [ 'CMD', 'pg_isready' ]
            interval: 10s
            timeout: 5s
            retries: 3

    mailpit:
        image: axllent/mailpit:v1.22.3
        environment:
            MP_DATABASE: /data/mailpit.db
        ports:
            - 1025:1025
            - 8025:8025
        volumes:
            - mailpit_data:/data
        restart: always

volumes:
    postgres_data:
    mailpit_data:
